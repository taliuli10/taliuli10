name: Generate Snake Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
  workflow_dispatch:

concurrency:
  group: snake-output
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution animations
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish animations to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
          commit_message: Update contribution animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
